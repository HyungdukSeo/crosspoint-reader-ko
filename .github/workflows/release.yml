name: Compile Release
on:
  push:
    tags:
    - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Install PlatformIO Core
      run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip esptool

    - name: Set version from tag
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: |
        python3 scripts/set_release_version.py

    - name: Build CrossPoint
      run: |
        pio run -e ble_probe
        python3 scripts/check_ota_size.py .pio/build/ble_probe/firmware.bin

    - name: Merge firmware binaries
      run: |
        python3 -m esptool --chip esp32c3 merge-bin \
          -o ".pio/build/ble_probe/CrossPoint-${GITHUB_REF_NAME}.bin" \
          --flash-mode dio \
          --flash-freq 80m \
          --flash-size 16MB \
          0x0 .pio/build/ble_probe/bootloader.bin \
          0x8000 .pio/build/ble_probe/partitions.bin \
          0x10000 .pio/build/ble_probe/firmware.bin

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CrossPoint-${{ github.ref_name }}
        path: |
          .pio/build/ble_probe/bootloader.bin
          .pio/build/ble_probe/firmware.bin
          .pio/build/ble_probe/firmware.elf
          .pio/build/ble_probe/firmware.map
          .pio/build/ble_probe/partitions.bin

    - name: Resolve release notes
      id: notes
      run: |
        NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
        if [[ -f "$NOTES" ]]; then
          echo "Using release notes from $NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "generate=false" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No release notes at $NOTES; falling back to auto-generated notes."
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "generate=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release with Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          .pio/build/ble_probe/CrossPoint-${{ github.ref_name }}.bin
          .pio/build/ble_probe/firmware.bin
          .pio/build/ble_probe/bootloader.bin
          .pio/build/ble_probe/partitions.bin
        body_path: ${{ steps.notes.outputs.path }}
        generate_release_notes: ${{ steps.notes.outputs.generate }}
        draft: false
        prerelease: false
        make_latest: true
